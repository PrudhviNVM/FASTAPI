<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mutual Fund SIP Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Mutual Fund SIP Calculator</h2>

        <div class="form-group">
            <label>Fund Name</label>
            <input type="text" id="fundName" placeholder="e.g. Axis Bluechip Fund">
        </div>

        <div class="form-group">
            <label>Monthly SIP Amount (₹)</label>
            <input type="number" id="sipAmount" placeholder="Enter SIP Amount">
        </div>

        <div class="form-group">
            <label>Duration (Years)</label>
            <input type="number" id="duration" placeholder="Enter Duration (Years)">
        </div>

        <button onclick="calculateSIP()">Calculate</button>

        <div id="resultBox" class="result hidden">
            <h3>Result</h3>
            <p><strong>Fund:</strong> <span id="rFund"></span></p>
            <p><strong>Total Invested:</strong> ₹<span id="rInvested"></span></p>
            <p><strong>Expected Value:</strong> ₹<span id="rValue"></span></p>
            <p><strong>Profit:</strong> ₹<span id="rProfit"></span></p>
            <p><strong>CAGR:</strong> <span id="rCagr"></span>%</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
